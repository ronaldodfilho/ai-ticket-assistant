spring.application.name=backend

# Lê variáveis de um arquivo .env, se existir (na raiz do projeto ou na pasta backend).
# Variáveis de ambiente do sistema continuam tendo prioridade.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# Banco H2 em memória (desenvolvimento). Para PostgreSQL, use o perfil "postgres".
spring.datasource.url=jdbc:h2:mem:aiticket_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Console do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.time-zone=UTC

# Servidor
server.port=${PORT:8080}

# CORS (padrões separados por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Integração com o Google Gemini
# Sem chave, a classificação usa palavras-chave e o resumo/sugestão usam modelos locais.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}
gemini.timeout-seconds=30
