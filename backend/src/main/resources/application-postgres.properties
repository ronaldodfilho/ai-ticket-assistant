# Perfil para PostgreSQL (ative com SPRING_PROFILES_ACTIVE=postgres).
# Os valores padrão batem com o docker-compose.yml da raiz do projeto.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/aiticket_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:aiticket}
spring.datasource.password=${DATABASE_PASSWORD:password}

spring.h2.console.enabled=false
